name: Test read secrets

on:
  workflow_dispatch:

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    environment: "Configure for Chat Work"   # ← Environment
    steps:
      - name: Validate required secrets are present
        env:
          CHATWORK_TOKEN: ${{ secrets.CHATWORK_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
          TO_HOSTNAME: ${{ secrets.TO_HOSTNAME }}
        run: |
          set -euo pipefail

          # simple preflight: fail if any required secret is empty
          missing=0
          for var in CHATWORK_TOKEN CHATWORK_ROOM_ID TO_HOSTNAME; do
            if [ -z "${!var:-}" ]; then
              echo "::error::$var is not set"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more required secrets are missing. Aborting."
            exit 1
          fi

          # mask function: show only first 3 and last 3 chars, rest replaced with *
          mask() {
            v="$1"
            len=${#v}
            if [ "$len" -le 6 ]; then
              echo "****"
            else
              first=${v:0:3}
              last=${v: -3}
              mid_len=$((len-6))
              mid=$(printf '%*s' "$mid_len" '' | tr ' ' '*')
              echo "${first}${mid}${last}"
            fi
          }

          echo "✅ All required secrets are present."

          # show masked info so you can confirm the workflow read them (without revealing secrets)
          echo "Masked CHATWORK_TOKEN: $(mask "$CHATWORK_TOKEN")"
          echo "Masked CHATWORK_ROOM_ID: $(mask "$CHATWORK_ROOM_ID")"
          echo "Masked TO_HOSTNAME: $(mask "$TO_HOSTNAME")"

          # build example URLs (masked hostname shown separately)
          TODAY=$(TZ=Asia/Tokyo date +%Y%m%d)
          SURVEY_URL="https://${TO_HOSTNAME}/?page=survey&date=${TODAY}"
          VOTE_URL="https://${TO_HOSTNAME}/?page=vote&date=${TODAY}"

          echo "Example survey URL (constructed but not posted):"
          echo "${SURVEY_URL}"
          echo "Example vote URL (constructed but not posted):"
          echo "${VOTE_URL}"

      - name: "Optional: attempt a dry-run POST (no-op)"
        if: ${{ always() }}
        env:
          CHATWORK_TOKEN: ${{ secrets.CHATWORK_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: |
          # このステップは実際の投稿は行いません。実際に投稿したい場合は下のコメントを外して利用してください。
          echo "Dry-run: not posting to Chatwork. To actually post, uncomment the curl command in this step."

          # 実際に投稿する場合の例（コメント解除して利用）
          # MESSAGE="テスト投稿: Secrets 読み取り確認"
          # curl -s -X POST "https://api.chatwork.com/v2/rooms/${CHATWORK_ROOM_ID}/messages" \
          #   -H "X-ChatWorkToken: ${CHATWORK_TOKEN}" \
          #   --data-urlencode "body=${MESSAGE}" \
          #   -o /tmp/chatwork_response.txt -w "%{http_code}" | {
          #     read status
          #     if [ "$status" != "200" ] && [ "$status" != "201" ]; then
          #       echo "Chatwork post failed with status $status"
          #       cat /tmp/chatwork_response.txt
          #       exit 1
          #     fi
          #   }
